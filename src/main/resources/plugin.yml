name: CustomMinecartSpeeds
version: '${version}'
main: io.github.derexxd.customminecartspeeds.CustomMinecartSpeeds
api-version: '1.21'
prefix: CustomMinecartSpeeds
authors: [ DerexXD ]
description: Per-minecart speed customization and limits for Minecraft 1.21.2 and above
website: https://www.derekchen.dev/
commands:
  customminecartspeeds:
    description: Reload CustomMinecartSpeeds configuration
    aliases: [ cms ]
    permission: customminecartspeeds.reload
permissions:
  customminecartspeeds.reload:
    description: Allows reloading the configuration
    default: op
